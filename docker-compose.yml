services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hashtag
      POSTGRES_PASSWORD: hashtag
      POSTGRES_DB: hashtag_tracking
    ports: ["5434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hashtag"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
